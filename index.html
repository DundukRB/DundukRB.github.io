<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEST SCRIPT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="wrapper">
        <div class="container">

            <div class="logo-glow"></div>

            <h1 class="title">
                <span class="title-best">BEST</span>
                <span class="title-script">SCRIPT</span>
            </h1>

            <p class="subtitle">The most powerful script you'll ever need</p>

            <div class="divider"></div>

            <div class="buttons">
                <button id="copyButton" class="action-btn script-btn" onclick="copyScript()" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="btn-svg default-icon">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="btn-svg check-icon">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    <span id="copyText">COPY SCRIPT</span>
                </button>

                <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" class="action-btn tutorial-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="btn-svg">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.546 12 3.546 12 3.546s-7.505 0-9.377.504A3.015 3.015 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.504 9.376.504 9.376.504s7.505 0 9.377-.504a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                    <span>TUTORIAL</span>
                </a>
            </div>

            <div class="footer-info">
                <div class="status-dot"></div>
                <span>Script is active &amp; undetected</span>
            </div>

        </div>
    </div>

    <div id="toast" class="toast">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="toast-icon">
            <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span>Script copied!</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
